# /etc/nginx/sites-available/cn-stock-screener
# 先 apt install nginx certbot python3-certbot-nginx
server {
    listen 80;
    server_name your-domain.com;          # 改成你的域名

    # 让 certbot 自动配 HTTPS：certbot --nginx -d your-domain.com

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
