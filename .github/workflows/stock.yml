# 放到仓库的 .github/workflows/stock.yml
#
# 免费方案：GitHub Actions 定时跑，结果提交到 docs/，由 Pages 托管。
# 准备：
#   1) 仓库 Settings → Secrets and variables → Actions → New secret
#      名字 TUSHARE_TOKEN，值是你的 Token
#   2) Settings → Pages → Source 选 "Deploy from a branch"，分支 main，目录 /docs
#   3) 把本文件复制到 .github/workflows/stock.yml
#
# 时区：cron 用 UTC，北京时间 = UTC+8

name: cn-stock-screener

on:
  # GitHub 自带 cron 会漂移 5~15 分钟，建议用外部触发（见 deploy/EXTERNAL_TRIGGER.md）
  # 这里保留作为兜底；两路同时触发时靠 concurrency 保证不并行
  schedule:
    # 每晚 22:30（北京）= 14:30 UTC，周一到周五
    - cron: '30 14 * * 1-5'
    # 交易时段每 15 分钟（北京 09:45~15:00 = UTC 01:45~07:00）
    - cron: '*/15 1-7 * * 1-5'

  workflow_dispatch:
    inputs:
      mode:
        description: 'auto=按时间自动判断 / scan=只跑盘中扫描 / rank=只跑收盘选股'
        required: false
        default: 'auto'
        type: choice
        options: [auto, scan, rank]

permissions:
  contents: write             # 需要提交 docs/ 回仓库

concurrency:
  # 按模式分组：盘中扫描之间互相顶掉（15 分钟一次，不该排队），
  # 收盘选股则排队，绝不被扫描打断（不然缓存和提交会断在半路）
  group: stock-${{ github.event.inputs.mode || 'auto' }}
  cancel-in-progress: ${{ (github.event.inputs.mode || 'auto') == 'scan' }}

jobs:
  run:
    runs-on: ubuntu-latest
    # 首次 750 天回补要 2250 次调用（约 12~18 分钟），留足余量；之后都是增量 1~2 分钟
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      # 1GB 日线缓存太大，不进 git；用 Actions 缓存滚动保存
      - name: 恢复数据缓存
        uses: actions/cache/restore@v4
        with:
          # output/reports 也要缓存：否则 scan 运行拿不到上一次 rank 的榜单，
          # 生成的页面会把"日线榜"清空
          path: |
            data/cache
            output/reports
          key: cache-${{ github.run_id }}
          restore-keys: |
            cache-

      - name: 决定这次跑什么
        id: session
        run: |
          MODE="${{ inputs.mode || 'auto' }}"
          if [ "$MODE" = "auto" ]; then
            MODE=$(python -c "from intraday.monitor import in_session; print('scan' if in_session() else 'rank')")
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "本次模式：$MODE"

      - name: 盘中扫描（交易时段）
        if: steps.session.outputs.mode == 'scan'
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: |
          # 国内行情接口从 GitHub 美国机房偶尔会失败，重试 3 次自愈
          ok=0
          for i in 1 2 3; do
            if python main.py --scan; then ok=1; break; fi
            echo "第 $i 次扫描失败，15 秒后重试…"
            sleep 15
          done
          if [ "$ok" != "1" ]; then echo "三次都没拿到行情，放弃本轮"; exit 1; fi

      - name: 收盘选股（非交易时段，或晚上那次）
        if: steps.session.outputs.mode == 'rank'
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: |
          # 有缓存就只走 10 天增量（约 30 次调用，1~2 分钟）；
          # 没缓存才回补 500 天（月线 MA20 需要 ~420 根）——这是首跑慢的根源
          N=$(ls data/cache/daily 2>/dev/null | wc -l)
          if [ "$N" -gt 100 ]; then DAYS=10; else DAYS=500; fi
          echo "本地日线分片 $N 个 → 使用 --days $DAYS"
          python main.py --cli --mode full --days $DAYS --score
          python main.py --publish docs

      - name: 生成静态页
        if: steps.session.outputs.mode == 'scan'
        run: python main.py --publish docs

      - name: 提交结果
        run: |
          git config user.name  "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          # docs/ 是纯生成物，没人工改动。如果推送时撞车（另一个运行也在写），
          # 直接作废本次提交、重新生成再推，最多重试 3 次。
          for i in 1 2 3; do
            python main.py --publish docs
            git add docs
            if git diff --cached --quiet; then
              echo "docs 无变化，跳过提交"
              exit 0
            fi
            git commit -m "update $(date -u +%Y-%m-%dT%H:%MZ) (#$i)"
            git fetch origin main --quiet
            git reset --soft origin/main
            git checkout -- docs 2>/dev/null || true
            git add docs
            if git diff --cached --quiet; then
              echo "reset 后无差异，跳过"
              exit 0
            fi
            git commit -m "update $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push origin HEAD:main 2>/dev/null; then
              echo "推送成功（第 $i 次）"
              exit 0
            fi
            echo "第 $i 次推送失败，重新生成后再试"
            git reset --hard origin/main --quiet
            sleep 5
          done
          echo "三次都没推上，放弃（下次运行会重试）"
          exit 1

      # 只有收盘那次才更新缓存（盘中发 16 次会撑爆 10GB 配额）
      - name: 保存数据缓存
        if: steps.session.outputs.mode == 'rank'
        uses: actions/cache/save@v4
        with:
          path: |
            data/cache
            output/reports
          key: cache-${{ github.run_id }}
